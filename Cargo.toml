[package]
name = "git-hours"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
jiff = "0.2.46"  # TODO: update this to 1.0.0 when a new gix version drops
